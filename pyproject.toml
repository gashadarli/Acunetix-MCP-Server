[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acunetix-mcp-server"
version = "2.1.0"
description = "Acunetix MCP Server — structured tools for the Acunetix Scanner API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Nijat Gashadarli"},
]
keywords = ["acunetix", "mcp", "security", "vulnerability-scanner"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
acunetix-mcp-server = "acunetix_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
acunetix_mcp = ["Acunetix-API-Documentation.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
